name: Portfolio Structure
on:
  push:
    branches: ["wave-*", "digital-forge"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify portfolio architecture
        run: python scripts/verify_wave3.py

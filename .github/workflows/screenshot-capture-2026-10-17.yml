name: Portfolio Demo Screenshot Capture 2026-10-17
on:
  push:
    branches: [media/screenshots-2026-10-17]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: "${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip media-export]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slug: ember-and-thyme
            kind: next
          - slug: forge-and-field-supply
            kind: preview
          - slug: juniper-row-realty
            kind: next
          - slug: orbitstack
            kind: preview
          - slug: redline-motorworks
            kind: next
          - slug: static-bloom-studio
            kind: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build
        working-directory: demos/${{ matrix.slug }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Start demo
        working-directory: demos/${{ matrix.slug }}
        run: |
          if [ "${{ matrix.kind }}" = "next" ]; then
            npm run start -- -H 127.0.0.1 -p 4173 > /tmp/demo.log 2>&1 &
          else
            npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/demo.log 2>&1 &
          fi
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/demo.log
          exit 1
      - name: Capture authentic demo
        run: |
          mkdir -p screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,1000 --screenshot=screenshots/${{ matrix.slug }}-desktop.png http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=430,932 --screenshot=screenshots/${{ matrix.slug }}-mobile.png http://127.0.0.1:4173/
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-${{ matrix.slug }}-screenshots
          path: screenshots/
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export selected media payloads
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, os
          slug = os.environ["DEMO_SLUG"]
          src = Path("screenshots") / f"{slug}-desktop.png"
          out = Path(".media-export")
          out.mkdir(exist_ok=True)
          im = Image.open(src).convert("RGB")
          w, h = im.size
          crop_h = min(h, round(w * 9 / 16))
          im = im.crop((0, 0, w, crop_h))
          if im.width > 1000:
              nh = round(im.height * 1000 / im.width)
              im = im.resize((1000, nh), Image.Resampling.LANCZOS)
          webp = out / f"{slug}.webp"
          im.save(webp, "WEBP", quality=68, method=6)
          (out / f"{slug}.webp.b64").write_text(base64.b64encode(webp.read_bytes()).decode("ascii"), encoding="ascii")
          webp.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .media-export
          if ! git diff --cached --quiet; then
            git commit -m "chore(media): export $DEMO_SLUG screenshot payload [skip media-export]"
            git pull --rebase origin media/screenshots-2026-10-17
            git push origin HEAD:media/screenshots-2026-10-17
          fi
        env:
          DEMO_SLUG: ${{ matrix.slug }}
